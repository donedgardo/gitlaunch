apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gitlaunch.fullname" . }}
  labels:
    {{- include "gitlaunch.labels" . | nindent 4 }}
data:
  PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  PORT: {{ .Values.config.port | quote }}
  NODE_ENV: "production"
  ANALYTICS_WAREHOUSE: {{ .Values.config.analyticsWarehouse | quote }}
  {{- with .Values.config.analyticsRetentionDays }}
  ANALYTICS_RETENTION_DAYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.redisUrl }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.emailFrom }}
  EMAIL_FROM: {{ . | quote }}
  {{- end }}
