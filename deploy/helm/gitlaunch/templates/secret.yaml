{{- include "gitlaunch.validateConfig" . -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlaunch.fullname" . }}
  labels:
    {{- include "gitlaunch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Omitted when mongodb.enabled: the bundled MongoDB's own Secret carries
         the composed URI, and the pod loads both with envFrom. */}}
  {{- with .Values.secrets.mongodbUri }}
  MONGODB_URI: {{ . | quote }}
  {{- end }}
  COOKIE_SECRET_SIGNATURE: {{ include "gitlaunch.cookieSecret" . | quote }}
  ENCRYPTION_KEY: {{ include "gitlaunch.encryptionKey" . | quote }}
  {{- with .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.licenseKey }}
  GITLAUNCH_LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppId }}
  GH_APP_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppClientId }}
  GH_APP_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppClientSecret }}
  GH_APP_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppWebhookSecret }}
  GH_APP_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppPrivateKey }}
  GH_APP_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.resendApiKey }}
  RESEND_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
