name: Test Deploy - Cancelled

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - prod
      buildId:
        description: "Build ID to deploy"
        required: true
        type: string
      delay-seconds:
        description: "Delay before cancelling (simulates partial deploy)"
        required: false
        default: "30"
        type: string

jobs:
  deploy-cancelled:
    name: "Deploy (Cancelled) → ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      BUILD_ID: ${{ inputs.buildId }}
      DELAY: ${{ inputs.delay-seconds || '30' }}
    steps:
      - name: GitLaunch Deploy
        uses: donedgardo/build-reporter@v2
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          api-url: https://gitlaunch.dev
          service-id: ${{ vars.GITLAUNCH_SERVICE_ID }}
          environment: ${{ env.ENVIRONMENT }}
          build-id: ${{ env.BUILD_ID }}
          action: deploy

      - name: Simulate deployment (cancel the workflow to test)
        run: |
          echo "Deploying build ${{ env.BUILD_ID }} to ${{ env.ENVIRONMENT }}..."
          echo "Cancel this workflow run to test cancelled status reporting."
          sleep ${{ env.DELAY }}

      - name: Summary
        run: |
          echo "## Test Deploy Cancelled" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | ${{ env.BUILD_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Final Status | auto-detected by post step |" >> $GITHUB_STEP_SUMMARY
