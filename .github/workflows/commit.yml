name: Commit

on:
  push:
    branches:
      - main

jobs:
  commit:
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_CI }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY_CI }}
      AWS_REGION: us-east-1
      IMAGE_TAG: ${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Unit Test
        run: yarn test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: launchpad
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws-container-definition.json
          container-name: launchpad
          image: ${{ steps.login-ecr.outputs.registry }}/launchpad:${{ env.IMAGE_TAG }}
          environment-variables: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            COOKIE_SECRET_SIGNATURE=${{ secrets.COOKIE_SECRET_SIGNATURE }}
            API_KEY=${{ secrets.API_KEY }}
            PORT=${{ secrets.PORT }}
            PUBLIC_URL=${{ secrets.PUBLIC_URL }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            GITHUB_PAT=${{ secrets.GH_PAT }}
            GITHUB_ORG=${{ secrets.GITHUB_ORG }}
            SERVICES=${{ secrets.SERVICES }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: launchpad
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Run e2e tests
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: yarn test:e2e
