name: CI

on:
  push:
    branches:
      - main
    # Release tags publish the semver image tags the Helm chart pins to via
    # image.tag / appVersion. Without this trigger those tags never exist.
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn build

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "ee/**/*.ts"

      - name: Unit tests
        run: yarn test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      PORT: 3051
      PUBLIC_URL: http://localhost:3051
      COOKIE_SECRET_SIGNATURE: test-secret-for-ci
      GH_APP_ID: "123456"
      GH_APP_CLIENT_ID: test-client-id
      GH_APP_CLIENT_SECRET: test-client-secret
      GH_APP_PRIVATE_KEY: test-private-key
      GH_APP_NAME: test-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build
        run: yarn build

      - name: Run E2E tests
        run: yarn test:e2e

  docker-build:
    name: Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Deliberately not ghcr.io/${{ github.repository }} — that would resolve
      # to .../launchpad. The Helm chart and the docs both name the image
      # gitlaunch, and the repository is only called launchpad for historical
      # reasons.
      IMAGE: ghcr.io/${{ github.repository_owner }}/gitlaunch
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never push. A fork PR gets a read-only token,
      # so pushing would fail anyway, but the explicit gate also stops an
      # untrusted branch from publishing an image under our name.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # image.source is stated rather than left to be inferred. GHCR links a
          # package to a repository through that label, and it is the only link
          # available here: the package is called gitlaunch and the repository
          # is called launchpad, so nothing matches by name. The link is what
          # gives the package the repository's access control, which is what
          # makes read:packages on a collaborator's token enough to pull the
          # image while the package is private, rather than the package needing
          # its own permission list.
          labels: |
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.title=GitLaunch
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/gitlaunch --set config.publicUrl=http://ci.invalid

      # The chart's default path generates secrets and reads them back with a
      # Helm `lookup`. That is correct for `helm install` and unusable under a
      # reconciler, which renders without a cluster and would therefore mint a
      # fresh encryption key on every sync. Our own environments opt out via
      # secrets.autoGenerate=false. This asserts the opt-out actually holds:
      # two renders of the same input must be byte-identical.
      - name: Environments render deterministically
        run: |
          for env in local onprem; do
            values="deploy/envs/$env/values.yaml"
            helm template gitlaunch deploy/helm/gitlaunch -f "$values" > "/tmp/$env.a"
            helm template gitlaunch deploy/helm/gitlaunch -f "$values" > "/tmp/$env.b"
            if ! diff -u "/tmp/$env.a" "/tmp/$env.b"; then
              echo "::error file=$values::$env renders differently each time — a reconciler would rewrite these values on every sync. Check secrets.autoGenerate and the existingSecret settings."
              exit 1
            fi
            if grep -q '^kind: Secret' "/tmp/$env.a"; then
              echo "::error file=$values::$env has the chart rendering a Secret. Secrets for reconciled environments belong in deploy/envs/$env/secrets, sealed."
              exit 1
            fi
            echo "$env: deterministic, no chart-rendered Secrets"
          done

      # Our own environments must run the artifact we publish, pinned to a tag
      # that can only ever mean one build. Both halves have already been wrong
      # here: the bare name `gitlaunch` (resolvable on one laptop, so the
      # environment was demonstrably not running what we ship) and the moving
      # tags `local` / `config` (which make `git revert` change the file and
      # nothing else — the rollback that looks like it worked).
      - name: Environments pin the published image
        run: |
          for env in local onprem; do
            values="deploy/envs/$env/values.yaml"
            rendered="$(helm template gitlaunch deploy/helm/gitlaunch -f "$values" \
              --show-only templates/deployment.yaml)"
            # Every image the Deployment names, minus the bundled MongoDB, which
            # is the only other container. Piping into `head` rather than
            # matching on `gitlaunch` keeps a wrong repository reaching the
            # check below with its own error message instead of dying in a
            # `grep` that found nothing.
            image="$(echo "$rendered" | awk '$1 == "image:" { gsub(/"/, "", $2); print $2 }' \
              | grep -v -e '^mongo:' -e '/mongo:' | head -1)"
            if [ -z "$image" ]; then
              echo "::error file=$values::no app container image in the rendered Deployment for $env"
              exit 1
            fi

            case "$image" in
              ghcr.io/donedgardo/gitlaunch:*) ;;
              *)
                echo "::error file=$values::$env runs '$image' — not the image CI publishes. Set image.repository to ghcr.io/donedgardo/gitlaunch."
                exit 1
                ;;
            esac

            tag="${image##*:}"
            # sha-<commit>, short from build-image.sh or full from CI, or a
            # semver a v* tag published. Anything else is a name that can be
            # made to point somewhere new.
            if ! echo "$tag" | grep -Eq '^(sha-[0-9a-f]{7,40}|[0-9]+\.[0-9]+(\.[0-9]+)?)$'; then
              echo "::error file=$values::$env pins image.tag '$tag', which is not immutable. Use sha-<commit> or a released semver."
              exit 1
            fi

            # The package inherits `private` from the repository, so a pull
            # without a credential fails — and fails late, at the first tag that
            # is not already side-loaded into the node.
            if ! echo "$rendered" | grep -q '^      imagePullSecrets:'; then
              echo "::error file=$values::$env sets no imagePullSecrets, so it cannot pull the private release image."
              exit 1
            fi

            echo "$env: $image, with a pull secret"
          done

      # The interlock itself: with generation off and no external Secret named,
      # the chart must refuse rather than quietly invent a credential.
      - name: autoGenerate=false refuses to render without existing Secrets
        run: |
          if helm template gitlaunch deploy/helm/gitlaunch \
               --set config.publicUrl=http://ci.invalid \
               --set mongodb.enabled=true \
               --set secrets.autoGenerate=false \
               --set secrets.existingSecret=app >/dev/null 2>&1; then
            echo "::error::chart rendered with autoGenerate=false and no mongodb.auth.existingSecret"
            exit 1
          fi
          echo "interlock holds"

  report-build:
    name: Report build
    runs-on: ubuntu-latest
    needs: [quality, integration, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Dogfoods the same curl guidance we give users (buildReportingInstructions.hbs):
      # send the commit message too, built with jq so arbitrary commit text can't
      # break the JSON.
      - name: Report build to GitLaunch
        env:
          GITLAUNCH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl --fail-with-body -sS -X POST \
            "https://gitlaunch.dev/api/v1/services/${{ vars.GITLAUNCH_SERVICE_ID }}/builds" \
            -H "Authorization: Bearer ${{ secrets.GITLAUNCH_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg buildId "${{ github.sha }}" --arg message "$GITLAUNCH_COMMIT_MESSAGE" '{buildId:$buildId,message:$message}')"

  deploy-dev:
    name: Deploy to Dev
    # Wait for report-build so the build exists before the dev deploy reports
    # its status against it (otherwise the reporter 404s with "Build not found").
    needs: [quality, integration, docker-build, report-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      buildId: ${{ github.sha }}
    secrets: inherit
