apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitlaunch.fullname" . }}
  labels:
    {{- include "gitlaunch.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitlaunch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when configuration changes. Without these, a
        # `helm upgrade` that only edits config leaves every replica running
        # the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gitlaunch.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gitlaunch.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mongodb.enabled }}
      initContainers:
        # The app exits (rather than retries) if MongoDB is unreachable at boot,
        # so on a first install it would crash-loop until the bundled database
        # finishes initialising. Waiting here turns that into a clean startup.
        # Uses the same URI the app will use, so it also proves the generated
        # credentials actually work before the app depends on them.
        - name: wait-for-mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ include "gitlaunch.mongodb.secretName" . }}
          command:
            - sh
            - -c
            - |
              until mongosh "$MONGODB_URI" --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do
                echo "waiting for mongodb..."
                sleep 2
              done
              echo "mongodb is accepting authenticated connections"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "gitlaunch.fullname" . }}
            - secretRef:
                name: {{ include "gitlaunch.secretName" . }}
            {{- if .Values.mongodb.enabled }}
            # Supplies MONGODB_URI for the bundled database. Listed last so it
            # is unambiguous which source wins if both ever set the same key.
            - secretRef:
                name: {{ include "gitlaunch.mongodb.secretName" . }}
            {{- end }}
          {{- with .Values.config.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything the process writes needs
            # an explicit writable mount. Node and Fastify only need a temp dir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
