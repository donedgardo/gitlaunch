name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      buildId:
        description: "Build ID (commit SHA)"
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      buildId:
        description: "Build ID (commit SHA)"
        required: false
        type: string
    secrets:
      GITLAUNCH_API_KEY:
        required: false
      RAILWAY_TOKEN:
        required: false
      RAILWAY_SERVICE_ID:
        required: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      BUILD_ID: ${{ inputs.buildId || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_ID }}

      - name: GitLaunch Deploy
        if: env.ENVIRONMENT != 'dev'
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          service-id: ${{ vars.GITLAUNCH_SERVICE_ID }}
          environment: ${{ env.ENVIRONMENT }}
          build-id: ${{ env.BUILD_ID }}
          action: deploy

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | ${{ env.BUILD_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
