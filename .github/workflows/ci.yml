name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn build

      - name: Format check
        run: npx prettier --check "src/**/*.ts"

      - name: Unit tests
        run: yarn test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      PORT: 3051
      PUBLIC_URL: http://localhost:3051
      COOKIE_SECRET_SIGNATURE: test-secret-for-ci
      GH_APP_ID: "123456"
      GH_APP_CLIENT_ID: test-client-id
      GH_APP_CLIENT_SECRET: test-client-secret
      GH_APP_PRIVATE_KEY: test-private-key
      GH_APP_NAME: test-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build
        run: yarn build

      - name: Run E2E tests
        run: yarn test:e2e

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [quality, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
