name: Deploy

on:
  repository_dispatch:
    types: [deployment]

  # Keep workflow_dispatch for manual deployments
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      build-id:
        description: "Build ID (commit SHA)"
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to ${{ github.event.client_payload.environment || inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment || inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
      BUILD_ID: ${{ github.event.client_payload.buildId || inputs.build-id || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_ID }}

      # Report: Deployment started (skip for dev)
      - name: Report deploying
        if: env.ENVIRONMENT != 'dev'
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          service-id: 697434f8f9d1eb666d8571de
          action: update-status
          build-id: ${{ env.BUILD_ID }}
          environment: ${{ env.ENVIRONMENT }}
          status: deploying

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Report: Deployment succeeded (skip for dev)
      - name: Report deployed
        if: success() && env.ENVIRONMENT != 'dev'
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          service-id: 697434f8f9d1eb666d8571de
          action: update-status
          build-id: ${{ env.BUILD_ID }}
          environment: ${{ env.ENVIRONMENT }}
          status: deployed

      # Report: Deployment failed (skip for dev)
      - name: Report error
        if: failure() && env.ENVIRONMENT != 'dev'
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          service-id: 697434f8f9d1eb666d8571de
          action: update-status
          build-id: ${{ env.BUILD_ID }}
          environment: ${{ env.ENVIRONMENT }}
          status: error

      # Report: Deployment cancelled (skip for dev)
      - name: Report cancelled
        if: cancelled() && env.ENVIRONMENT != 'dev'
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          service-id: 697434f8f9d1eb666d8571de
          action: update-status
          build-id: ${{ env.BUILD_ID }}
          environment: ${{ env.ENVIRONMENT }}
          status: cancelled

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | ${{ env.BUILD_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
