name: Test Build Reporter

on:
  workflow_dispatch:
    inputs:
      build-id:
        description: "Build ID to report (defaults to random UUID)"
        required: false
        type: string
      service-id:
        description: "Service ID to report to (defaults to GITLAUNCH_SERVICE_ID var)"
        required: false
        type: string

jobs:
  report-fronted-build:
    name: Report Dummy Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Report build to GitLaunch
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          api-url: https://gitlaunch.dev
          service-id: ${{ inputs.service-id || vars.GITLAUNCH_SERVICE_ID }}
          action: report-build
          build-id: ${{ inputs.build-id || github.sha }}

  report-backend-build:
    name: Report Dummy Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Report build to GitLaunch
        uses: donedgardo/build-reporter@v1
        with:
          api-key: ${{ secrets.GITLAUNCH_API_KEY }}
          api-url: https://gitlaunch.dev
          service-id: ${{ inputs.service-id || vars.GITLAUNCH_SERVICE_ID }}
          action: report-build
          build-id: ${{ inputs.build-id || github.sha }}
