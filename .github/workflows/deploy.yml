name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        # These are GitLaunch environment names as well as GitHub ones: the
        # value is used in the status URL below, and it is what the release
        # board sends when someone clicks Deploy.
        options:
          - dev
          - staging
          - prod
      buildId:
        description: "Build ID (commit SHA)"
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string
      buildId:
        description: "Build ID (commit SHA)"
        required: false
        type: string
    secrets:
      GITLAUNCH_API_KEY:
        required: false
      RAILWAY_TOKEN:
        required: false
      RAILWAY_SERVICE_ID:
        required: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      BUILD_ID: ${{ inputs.buildId || github.sha }}
      # Dogfoods the same curl guidance we give users (deploymentSetupGuide.hbs).
      DEPLOY_URL: "https://gitlaunch.dev/api/v1/services/${{ vars.GITLAUNCH_SERVICE_ID }}/builds/${{ inputs.buildId || github.sha }}/deploy/${{ inputs.environment }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_ID }}

      - name: Report deploying
        run: |
          curl --fail-with-body -sS -X PATCH "$DEPLOY_URL" \
            -H "Authorization: Bearer ${{ secrets.GITLAUNCH_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"deploying"}'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Explicit terminal status — GitHub-native success()/failure()/cancelled()
      # is reliable, unlike the post-hook which can't read the job outcome.
      - name: Report deployed
        if: success()
        run: |
          curl --fail-with-body -sS -X PATCH "$DEPLOY_URL" \
            -H "Authorization: Bearer ${{ secrets.GITLAUNCH_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"deployed"}'

      - name: Report error
        if: failure()
        run: |
          curl --fail-with-body -sS -X PATCH "$DEPLOY_URL" \
            -H "Authorization: Bearer ${{ secrets.GITLAUNCH_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"error"}'

      - name: Report cancelled
        if: cancelled()
        run: |
          curl --fail-with-body -sS -X PATCH "$DEPLOY_URL" \
            -H "Authorization: Bearer ${{ secrets.GITLAUNCH_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"cancelled"}'

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ env.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | ${{ env.BUILD_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
